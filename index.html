<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Tree</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Our family tree — browse relatives, photos, stories and how we are related.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='10' r='8' fill='%232f7a55'/%3E%3Crect x='14' y='16' width='4' height='12' rx='2' fill='%237a5230'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { const t = localStorage.getItem('ft.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/chart" id="brand"><span class="brand-mark" aria-hidden="true"></span><span id="site-title">Family Tree</span></a>
    <div class="search" role="search">
      <input id="search" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Search a name…" aria-label="Search">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
    <div class="top-actions">
      <button class="chip" id="me-chip" type="button"></button>
      <button class="icon-btn" id="lang-btn" type="button" aria-label="Language">EN</button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme"></button>
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu" aria-haspopup="true"></button>
    </div>
  </header>

  <div id="edit-bar" class="edit-bar" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="bottom-tabs" id="bottom-tabs" aria-label="Views"></nav>

  <div id="menu" class="menu" hidden></div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
